name: Spotless, Checkstyle and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew and CVTemplates.sh
        run: chmod +x ./gradlew ./CVTemplates.sh

      # FORK DIVERGENCE: fonts and UI templates are git-ignored (.gitignore "Templates"),
      # but Ocr.loadFont needs the font indexes and ReplayProfileScriptTest boots the OCR
      # stack, so a fresh clone must fetch them before `check` can pass.
      - name: Fetch fonts and UI templates
        run: ./CVTemplates.sh

      - name: Run Spotless check, Checkstyle and tests
        run: ./gradlew check
